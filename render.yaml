services:
  - type: web
    name: sara-backend
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed
    startCommand: node server/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
